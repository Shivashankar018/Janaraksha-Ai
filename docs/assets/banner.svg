<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">JanaRaksha AI</title>
  <desc id="desc">JanaRaksha AI: a paper-light police station prototype for Kalaburagi, by Team Smarties for the Kalyan Karnataka Buildathon 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62182a"/>
      <stop offset="0.55" stop-color="#4a0e19"/>
      <stop offset="1" stop-color="#2e0a13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4b35e"/>
      <stop offset="1" stop-color="#b08a2e"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d4b35e" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <circle cx="1130" cy="200" r="250" fill="none" stroke="#d4b35e" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="1130" cy="200" r="190" fill="none" stroke="#d4b35e" stroke-opacity=".08" stroke-width="2" stroke-dasharray="4 10"/>
  <rect x="0" y="388" width="1280" height="12" fill="url(#gold)"/>
  <g transform="translate(80 92) scale(2.16)"><circle cx="50" cy="50" r="49.5" fill="#4a0e19"/><circle cx="50" cy="50" r="47.5" fill="none" stroke="#d4b35e" stroke-width="1.4"/><circle cx="50" cy="50" r="40.5" fill="none" stroke="#d4b35e" stroke-width="1" stroke-dasharray="1.5 3.2" opacity=".8"/><circle cx="50" cy="50" r="31" fill="#fff"/><circle cx="50" cy="50" r="31" fill="none" stroke="#c9a446" stroke-width="1.6"/><g transform="translate(50 50) scale(1.6) translate(-12 -12.2)" fill="none" stroke="#4a0e19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3z" fill="#fbf3dc"/><circle cx="9.5" cy="10.5" r="1.3" fill="#4a0e19"/><circle cx="14.5" cy="14" r="1.3" fill="#4a0e19"/><path d="M10.6 11.4l2.8 1.8"/></g></g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="340" y="150" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="3">JANARAKSHA <tspan fill="#d4b35e">AI</tspan></text>
    <text x="342" y="200" fill="#ecd9d4" font-size="27" font-weight="500">Paper-light police station for Kalaburagi</text>
    <text x="342" y="252" fill="#d4b35e" font-size="19" font-weight="600" letter-spacing="0.5">Citizen complaints · Station records · Case connections · Commissioner oversight · Raksha AI</text>
    <text x="342" y="296" fill="#ecd9d4" font-size="19">English | ಕನ್ನಡ   ·   Works in one web page   ·   Fictional demo data</text>
    <text x="342" y="346" fill="#ecd9d4" fill-opacity=".75" font-size="16" letter-spacing="1.5">TEAM SMARTIES · KALYAN KARNATAKA BUILDATHON 2026</text>
  </g>
</svg>
